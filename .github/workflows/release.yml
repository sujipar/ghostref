name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  to-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Never ship something the tests have not just passed on.
      - run: npm test
      # A tag that disagrees with package.json means one of the two is wrong,
      # and shipping either way puts a version into the world that does not
      # match its own source.
      - name: the tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }
      - run: npm run release:registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
