name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Node 18 and 20 do not expand globs for --test, so the directory form
      # is the only spelling that works on every supported version.
      - run: npm test

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # test/sample carries deliberate bugs, so it is excluded here and
      # asserted on separately by the test suite.
      - name: ghostref on itself
        run: node bin/ghostref.mjs . --exclude test/sample --exclude bench/repos
      - name: the sample must still report exactly its three planted bugs
        run: |
          set -o pipefail
          node bin/ghostref.mjs test/sample --json --no-exit-code > out.json
          node -e '
            const j = JSON.parse(require("node:fs").readFileSync("out.json", "utf8"));
            const want = ["missing-css-var", "missing-id", "missing-selector"];
            const got = j.findings.map(f => f.rule).sort();
            if (JSON.stringify(got) !== JSON.stringify(want)) {
              console.error("expected", want, "got", got);
              process.exit(1);
            }
            console.log("sample ok:", got.join(", "));
          '

  # The first line of the README is an instruction, not a description. If it
  # stops working the README becomes a lie, and a stranger finds that out
  # before we do.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: pack, install into an empty project, and run it like a user
        run: |
          set -euo pipefail
          npm pack
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm i "$GITHUB_WORKSPACE"/ghostref-*.tgz
          mkdir -p app
          {
            echo '<div class="hero" id="top"></div>'
            echo '<script>document.querySelector(".heor")</script>'
          } > app/p.html
          {
            echo ':root{--brand:#09f}'
            echo '.hero{color:var(--brnad)}'
          } > app/s.css
          ./node_modules/.bin/ghostref --version
          set +e
          out=$(./node_modules/.bin/ghostref app)
          code=$?
          set -e
          printf '%s\n' "$out"
          test "$code" = "1" || { echo "expected exit 1, got $code"; exit 1; }
          printf '%s' "$out" | grep -q '\.hero' || { echo "selector suggestion missing"; exit 1; }
          printf '%s' "$out" | grep -q 'var(--brand)' || { echo "var suggestion missing"; exit 1; }
          echo "installed-and-ran ok"
